<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Мониторинг игроков Галактики Игр: регистрации, сессии, время и результативность.">
<title>Мониторинг — Галактика Игр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #4de1ff; --purple: #b14bff; --pink: #ff5ecb; --gold: #ffd500;
  --panel: rgba(10, 14, 34, 0.75); --border: rgba(120, 140, 255, 0.3);
  --text: #e8ecff; --dim: #9aa4d6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100vh; background: #05060f; color: var(--text); font-family: 'Russo One', 'Segoe UI', Arial, sans-serif; }
#starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.nebula {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(900px 700px at 12% 18%, rgba(177, 75, 255, 0.16), transparent 60%),
    radial-gradient(1000px 800px at 88% 12%, rgba(0, 180, 255, 0.14), transparent 60%),
    radial-gradient(1100px 900px at 78% 88%, rgba(255, 94, 203, 0.12), transparent 60%);
}
body { position: relative; }

#exitBtn {
  position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 999; font-family: 'Russo One', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 1px; color: #ffd9c9; text-decoration: none; white-space: nowrap;
  background: linear-gradient(135deg, rgba(255,90,80,0.25), rgba(255,140,40,0.28));
  border: 1px solid rgba(255,120,90,0.65); border-radius: 10px; padding: 7px 14px;
  pointer-events: auto; cursor: pointer; user-select: none;
  box-shadow: 0 4px 18px rgba(0,0,0,0.4); transition: transform .12s ease, box-shadow .2s ease;
}
#exitBtn:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 0 22px rgba(255,120,90,0.55); }

.page { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 64px 16px 40px; display: flex; flex-direction: column; gap: 22px; }

.section {
  background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
  padding: 22px; backdrop-filter: blur(8px); box-shadow: 0 0 40px rgba(0,0,0,0.45);
}
h1 {
  font-family: 'Orbitron', sans-serif; font-size: clamp(22px, 3.4vw, 34px); font-weight: 900;
  letter-spacing: 3px; text-align: center;
  background: linear-gradient(100deg, var(--cyan), var(--purple), var(--pink));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 30px rgba(177, 75, 255, 0.35);
}
.sub { color: var(--dim); font-size: 13px; letter-spacing: 1px; text-align: center; margin-top: 6px; }
.section-title { font-family: 'Orbitron', sans-serif; font-size: 17px; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.stat-box {
  background: rgba(8, 11, 28, 0.7); border: 1px solid rgba(120,140,255,0.25); border-radius: 14px;
  padding: 14px; text-align: center;
}
.stat-box .num { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: var(--gold); }
.stat-box .num.cyan { color: var(--cyan); }
.stat-box .num.pink { color: var(--pink); }
.stat-box .lbl { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-top: 4px; text-transform: uppercase; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--dim); text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(120,140,255,0.25); text-transform: uppercase; }
.table td { padding: 9px 10px; border-bottom: 1px solid rgba(120,140,255,0.12); color: var(--text); }
.table tr:last-child td { border-bottom: none; }
.table td.r, .table th.r { text-align: right; }
.table .guest { color: var(--dim); font-style: italic; }
.table .player { color: var(--cyan); font-weight: 700; }
.table .empty { text-align: center; color: var(--dim); padding: 18px; font-size: 13px; }
.table tr.clickable { cursor: pointer; transition: background .15s ease; }
.table tr.clickable:hover td { background: rgba(77,225,255,0.06); }
.detail-row td { padding: 0; background: rgba(6,9,24,0.55); }
.detail-row .inner { padding: 6px 10px 14px; }
.detail-row .inner table th { font-size: 9px; }

.chip {
  display: inline-block; font-size: 11px; letter-spacing: 1px;
  padding: 3px 9px; border-radius: 8px; margin: 1px 2px 1px 0;
  background: rgba(154,164,214,0.12); border: 1px solid rgba(154,164,214,0.35); color: var(--dim);
}
.chip.win { background: rgba(87,255,143,0.12); border-color: rgba(87,255,143,0.45); color: #57ff8f; }

.note { font-size: 12px; color: var(--dim); letter-spacing: .5px; text-align: center; opacity: .85; line-height: 1.7; }
.hidden { display: none; }

@media (max-width: 640px) {
  .page { padding: 64px 8px 30px; }
  .section { padding: 14px; }
}
</style>
</head>
<body>
<a id="exitBtn" href="./" title="Вернуться в каталог">🚪 КАТАЛОГ ИГР</a>
<canvas id="starfield"></canvas>
<div class="nebula"></div>

<div class="page">
  <h1>🛰 МОНИТОРИНГ ИГРОКОВ</h1>
  <div class="sub">Сводка по регистрациям и сессиям посетителей</div>

  <div class="section">
    <div class="stat-grid">
      <div class="stat-box"><div class="num" id="statPlayers">0</div><div class="lbl">👤 Игроков</div></div>
      <div class="stat-box"><div class="num cyan" id="statSessions">0</div><div class="lbl">🎮 Сессий</div></div>
      <div class="stat-box"><div class="num pink" id="statTime">0 мин</div><div class="lbl">⏱ Общее время</div></div>
      <div class="stat-box"><div class="num" id="statWins">0</div><div class="lbl">🏆 Побед</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 Игроки</div>
    <table class="table">
      <thead><tr><th>#</th><th>Игрок</th><th>Почта</th><th class="r">Регистрация</th><th class="r">Время</th><th class="r">Сессий</th><th class="r">Побед</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">💾 Данные</div>
    <p class="note" id="dataNote"></p>
  </div>
</div>

<script src="assets/profile.js"></script>
<script>
(() => {
  const cv = document.getElementById('starfield');
  const c = cv.getContext('2d');
  let stars = [];
  function resize() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    stars = [];
    const count = Math.floor(cv.width * cv.height / 4200);
    for (let i = 0; i < count; i++) stars.push({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      r: Math.random() * 1.6 + 0.3, base: Math.random() * 0.55 + 0.25,
      speed: Math.random() * 0.018 + 0.004, phase: Math.random() * Math.PI * 2
    });
  }
  function draw(t) {
    c.clearRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      const a = s.base + Math.sin(t * s.speed + s.phase) * 0.3;
      c.globalAlpha = Math.max(0.05, a);
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      c.fill();
    }
    c.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

  const $ = id => document.getElementById(id);
  const fmt = ms => {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + ' сек';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' мин';
    return Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин';
  };
  const names = (window.Galaxy && Galaxy.GAME_NAMES) || {};
  const isWin = r => /побед|победа|выигр|заработал|очков/.test(r || '') && !/пораж/.test(r || '');

  const sbHeaders = () => {
    const c = Galaxy.CONFIG.SUPABASE;
    return { apikey: c.anonKey, Authorization: 'Bearer ' + c.anonKey, 'Content-Type': 'application/json' };
  };

  function groupSessions(sessions, playerMeta) {
    const players = new Map();
    for (const rec of sessions) {
      const mail = rec.player_email || rec.email || '';
      const isReg = mail !== '';
      const key = isReg
        ? 'reg:' + mail
        : 'guest:' + (rec.device_id || rec.deviceId || 'local') + ':' + (rec.guest_id || rec.guestId || rec.nickname || '');
      if (!players.has(key)) {
        players.set(key, {
          key, label: rec.nickname || 'Гость', email: mail,
          deviceId: rec.device_id || rec.deviceId || '', isReg,
          registeredAt: rec.ts, firstSeen: rec.ts, timeMs: 0, sessions: [], wins: 0
        });
      }
      const p = players.get(key);
      p.sessions.push(rec);
      p.timeMs += rec.duration_ms || rec.durationMs || 0;
      if (rec.ts && rec.ts < p.firstSeen) p.firstSeen = rec.ts;
      if (isWin(rec.result)) p.wins++;
    }
    // merge multi-device registered players by email
    const byEmail = new Map();
    const final = [];
    for (const p of players.values()) {
      if (p.isReg) {
        if (!byEmail.has(p.email)) { byEmail.set(p.email, Object.assign({}, p, { sessions: [] })); }
        const m = byEmail.get(p.email);
        m.sessions = m.sessions.concat(p.sessions);
        m.timeMs += p.timeMs;
        m.wins += p.wins;
        if (p.firstSeen < m.firstSeen) m.firstSeen = p.firstSeen;
        if (!m.registeredAt || p.registeredAt < m.registeredAt) m.registeredAt = p.registeredAt;
      } else {
        final.push(p);
      }
    }
    for (const m of byEmail.values()) final.push(m);
    final.forEach(p => p.sessions.sort((a, b) => (new Date(b.ts || b.tsRaw || 0)) - (new Date(a.ts || a.tsRaw || 0))));
    return final;
  }

  function renderPlayers(list, sessionsTotal) {
    $('statPlayers').textContent = list.length;
    $('statSessions').textContent = sessionsTotal;
    $('statTime').textContent = fmt(list.reduce((s, p) => s + p.timeMs, 0));
    $('statWins').textContent = list.reduce((s, p) => s + p.wins, 0);

    const tbody = $('playersBody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Пока нет данных. Заходи на игры — сессии начнут записываться.</td></tr>';
      return;
    }
    const sorted = list.slice().sort((a, b) => b.firstSeen - a.firstSeen);
    tbody.innerHTML = sorted.map((p, i) => {
      const regDate = new Date(p.registeredAt || p.firstSeen).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
      return '<tr class="clickable" data-key="' + p.key + '">' +
        '<td>' + (i + 1) + '</td>' +
        '<td class="' + (p.isReg ? 'player' : 'guest') + '">' + p.label + '</td>' +
        '<td>' + (p.email || '—') + '</td>' +
        '<td class="r">' + regDate + '</td>' +
        '<td class="r">' + fmt(p.timeMs) + '</td>' +
        '<td class="r">' + p.sessions.length + '</td>' +
        '<td class="r">' + p.wins + '</td>' +
        '</tr>';
    }).join('') + sorted.map(p =>
      '<tr class="detail-row hidden" data-detail="' + p.key + '"><td colspan="7"><div class="inner">' +
      '<table class="table"><thead><tr><th>Дата</th><th>Время</th><th>Игра</th><th class="r">Длительность</th><th>Результат</th></tr></thead><tbody>' +
      p.sessions.map(s =>
        '<tr><td>' + (s.date || '') + '</td><td>' + (s.time || '') + '</td><td>' + (names[s.game] || s.game) + '</td>' +
        '<td class="r">' + fmt(s.duration_ms || s.durationMs || 0) + '</td>' +
        '<td><span class="chip ' + (isWin(s.result) ? 'win' : '') + '">' + (s.result || 'не завершено') + '</span></td></tr>'
      ).join('') +
      '</tbody></table></div></td></tr>'
    ).join('');

    tbody.querySelectorAll('tr.clickable').forEach(row => {
      row.addEventListener('click', () => {
        const key = row.getAttribute('data-key');
        const detail = tbody.querySelector('tr.detail-row[data-detail="' + key + '"]');
        if (detail) detail.classList.toggle('hidden');
      });
    });
  }

  async function loadServer() {
    if (!window.Galaxy || !Galaxy.isSyncEnabled()) return null;
    const base = (Galaxy.CONFIG.SUPABASE.url || '').replace(/\/+$/, '');
    try {
      const [d, s] = await Promise.all([
        fetch(base + '/rest/v1/rpc/monitor_data', { method: 'POST', headers: sbHeaders(), body: '{}' }),
        fetch(base + '/rest/v1/rpc/monitor_sessions', { method: 'POST', headers: sbHeaders(), body: '{}' })
      ]);
      if (!d.ok || !s.ok) return null;
      const data = await d.json();
      const sessions = await s.json();
      return { data, sessions };
    } catch (e) { return null; }
  }

  async function render() {
    if (!window.Galaxy) return;
    const server = await loadServer();
    if (server) {
      const meta = new Map();
      (server.data || []).forEach(r => {
        const isReg = r.player_email && r.player_email !== '';
        const key = isReg ? 'reg:' + r.player_email : 'guest:' + r.device_id + ':' + r.nickname;
        if (!meta.has(key)) {
          meta.set(key, { registeredAt: r.registered_at, verified: r.verified, email: r.player_email, deviceId: r.device_id, nickname: r.nickname });
        } else {
          const m = meta.get(key);
          if (r.registered_at && r.registered_at < m.registeredAt) m.registeredAt = r.registered_at;
          if (r.verified) m.verified = true;
        }
      });
      const serverSessions = (server.sessions || []).map(s => Object.assign({}, s, { tsRaw: new Date(s.ts).getTime() }));
      const list = groupSessions(serverSessions, meta);
      list.forEach(p => {
        const m = p.isReg ? meta.get('reg:' + p.email) : meta.get(p.key);
        if (m) {
          p.registeredAt = m.registeredAt || p.registeredAt;
          p.verified = m.verified;
        }
        p.firstSeen = p.sessions.length ? new Date(p.sessions[p.sessions.length - 1].ts).getTime() : p.firstSeen;
      });
      renderPlayers(list, serverSessions.length);
      $('dataNote').innerHTML = '☁️ Синк-сервер подключён: данные всех посетителей со всех устройств. ' +
        (serverSessions.length >= 5000 ? 'Показаны последние 5000 сессий.' : '');
      return;
    }
    // fallback: local browser data
    const sessions = Galaxy.getSessions().map(s => Object.assign({}, s, { tsRaw: s.ts }));
    const list = groupSessions(sessions, new Map());
    renderPlayers(list, sessions.length);
    const synced = Galaxy.isSyncEnabled();
    $('dataNote').innerHTML = synced
      ? 'Синк-сервер не отвечает — показаны локальные данные этого устройства.'
      : 'Синк-сервер не подключён — показаны данные этого устройства. Подключи Supabase в assets/profile.js (CONFIG.SUPABASE: url + anonKey), чтобы видеть всех посетителей.';
  }

  render();
  if (window.Galaxy) Galaxy.onUpdate(() => render());
})();
</script>
</body>
</html>
